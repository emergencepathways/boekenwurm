<title>Boekenwurm Playtest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one reading column, like a page held in the hand; tools around it stay quiet. */
:root {
  --paper: #f2f5ef;      /* page ground, a faint leaf tint */
  --sheet: #fbfcf9;      /* the reading card */
  --ink: #1b2622;        /* text */
  --muted: #5d6b65;      /* secondary text */
  --line: #d5ddd6;       /* hairlines */
  --leaf: #2d7a4c;       /* accent: the worm's green */
  --leaf-soft: #dcefe2;
  --mark: #f3d25c;       /* highlighter on revealed words */
  --mark-ink: #1b2622;
  --strike: #b83a26;     /* semantic: a used strike, failure */
  --strike-soft: #f6dcd6;
  --gold: #b5851c;       /* semantic: tokens and badges */
  --gold-soft: #f6ead0;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --read: "Literata", "Iowan Old Style", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ui: "Bricolage Grotesque", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121815; --sheet: #19211d; --ink: #e4ece7; --muted: #9aaba3; --line: #2c3833;
    --leaf: #6cc48f; --leaf-soft: #20382a; --mark: #7d6a1f; --mark-ink: #fff7d6;
    --strike: #ef7b65; --strike-soft: #3e211b; --gold: #e2b54b; --gold-soft: #3a3019; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121815; --sheet: #19211d; --ink: #e4ece7; --muted: #9aaba3; --line: #2c3833;
  --leaf: #6cc48f; --leaf-soft: #20382a; --mark: #7d6a1f; --mark-ink: #fff7d6;
  --strike: #ef7b65; --strike-soft: #3e211b; --gold: #e2b54b; --gold-soft: #3a3019; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 44rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 48px; display: grid; gap: 16px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; border-bottom: 1px solid var(--line); }
.brand { font: 700 1.35rem/1 var(--display); letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 8px; }
.brand small { font: 500 0.7rem/1 var(--mono); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
nav.tabs { margin-left: auto; display: flex; gap: 4px; }
nav.tabs button { font: 500 0.9rem var(--ui); background: none; border: 1px solid transparent; color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--line); background: var(--sheet); }
button:focus-visible, select:focus-visible, input:focus-visible, .w:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

.titlechip { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
.titlechip b { color: var(--ink); font-weight: 600; }

/* status strip above the page */
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; font-size: 0.85rem; color: var(--muted); }
.strip .grow { flex: 1; }
.label { font: 500 0.68rem/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.strikes { display: inline-flex; gap: 5px; align-items: center; }
.pip { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--leaf); }
.pip.used { background: var(--strike); border-color: var(--strike); }
.pip.last { border-style: dashed; border-color: var(--strike); }
.streak { font: 700 0.85rem var(--display); color: var(--leaf); background: var(--leaf-soft); padding: 3px 10px; border-radius: 999px; }
.tokens { display: inline-flex; gap: 4px; }
.tok { width: 10px; height: 10px; transform: rotate(45deg); border: 2px solid var(--gold); }
.tok.on { background: var(--gold); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* the page */
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: clamp(18px, 4vw, 36px); display: grid; gap: 18px; touch-action: pan-y; }
.folio { display: flex; justify-content: space-between; gap: 12px; font: 500 0.72rem var(--mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.para { font: 400 1.32rem/1.75 var(--read); max-width: 34em; margin: 0; overflow-wrap: anywhere; }
.w { font: inherit; color: inherit; background: none; border: 0; padding: 0 1px; margin: 0 -1px; border-radius: 3px; cursor: pointer; }
.w:hover { background: var(--leaf-soft); }
.w.rev { background: var(--mark); color: var(--mark-ink); }
.w.name { text-decoration: underline dotted var(--muted); text-underline-offset: 4px; }
.def { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 6px; min-height: 4.2em; }
.def .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.def .word { font: 600 1.15rem var(--read); }
.def .lemma { font: 500 0.78rem var(--mono); color: var(--muted); }
.def .meaning { font: 400 1.05rem/1.45 var(--read); }
.def .meaning.nl { font-style: italic; }
.def .note { font-size: 0.82rem; color: var(--muted); }
.def .undo { margin-left: auto; }
.warn { color: var(--strike); font-weight: 600; font-size: 0.85rem; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { font: 600 0.95rem var(--ui); border-radius: 999px; padding: 10px 18px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--leaf); border-color: var(--leaf); color: var(--sheet); }
.btn.small { padding: 5px 12px; font-size: 0.82rem; }
.btn.ghost { background: none; }
.btn:disabled { opacity: 0.5; cursor: default; }
.next { margin-left: auto; }

/* panels */
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: grid; gap: 12px; }
.panel h2, .panel h3 { font: 700 1.15rem/1.2 var(--display); margin: 0; text-wrap: balance; }
.panel h3 { font-size: 1rem; }
.panel p { margin: 0; color: var(--muted); max-width: 60ch; }
.verdict { padding: 12px 14px; border-radius: 6px; background: var(--leaf-soft); display: grid; gap: 4px; }
.verdict.bad { background: var(--strike-soft); }
.verdict b { font-family: var(--display); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
select, .file { font: 500 0.9rem var(--ui); padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); }
.file { cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.file input { position: absolute; opacity: 0; width: 1px; height: 1px; }

/* summary */
.big { font: 700 clamp(1.6rem, 5vw, 2.2rem)/1.1 var(--display); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th { text-align: left; font: 500 0.68rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
td .forms { color: var(--muted); font-size: 0.82rem; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--strike); }

/* flashcards */
.card { min-height: 220px; display: grid; place-items: center; text-align: center; gap: 10px; padding: 24px; background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; }
.card .front { font: 600 1.8rem var(--read); }
.card .ctx { font: italic 1rem/1.5 var(--read); color: var(--muted); max-width: 34em; }
.card .back { font: 400 1.15rem var(--read); }

/* badges */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.badge { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 12px 6px; border-radius: 6px; }
.medal { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font: 700 1.2rem var(--display); border: 3px solid var(--line); color: var(--muted); background: var(--paper); }
.badge.got .medal { border-color: var(--gold); color: var(--ink); background: var(--gold-soft); box-shadow: inset 0 0 0 4px var(--sheet); }
.badge.placement .medal { border-style: dashed; }
.badge .t { font: 600 0.82rem var(--display); }
.badge .m { font-size: 0.72rem; color: var(--muted); }

/* toast and modal */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
.scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; place-items: center; z-index: 30; padding: 16px; }
.modal { background: var(--sheet); border-radius: 10px; padding: 24px; max-width: 26rem; width: 100%; display: grid; gap: 14px; justify-items: center; text-align: center; border: 1px solid var(--line); }
.modal .medal { width: 92px; height: 92px; font-size: 1.6rem; border-color: var(--gold); background: var(--gold-soft); color: var(--ink); }
@media (prefers-reduced-motion: no-preference) {
  .modal { animation: rise 0.35s ease-out; }
  .toast { animation: rise 0.25s ease-out; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0.4; } }
  .toast { animation-name: none; }
}
/* level matching */
.matched { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 0.82rem; }
.chip { font: 600 0.75rem var(--display); padding: 3px 10px; border-radius: 999px; background: var(--leaf-soft); color: var(--leaf); }
.chip.ok { background: var(--gold-soft); color: var(--gold); }
.chip.warn { background: var(--strike-soft); color: var(--strike); }
.original { border-left: 3px solid var(--line); padding-left: 14px; display: grid; gap: 4px; }
.original p { margin: 0; font: 400 1.02rem/1.6 var(--read); color: var(--muted); max-width: 40em; }
.ctx-meaning { display: grid; gap: 2px; padding-top: 8px; border-top: 1px dashed var(--line); }
.stats { display: flex; flex-wrap: wrap; gap: 10px 22px; justify-content: center; }
.stat { display: grid; gap: 2px; justify-items: center; }
.stat b { font: 700 1.3rem var(--display); }
.modal p { margin: 0; }
.muted { color: var(--muted); }
.empty { color: var(--muted); font-style: italic; }
@media (max-width: 480px) {
  .para { font-size: 1.18rem; }
  nav.tabs { margin-left: 0; width: 100%; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Boekenwurm <small>playtest</small></div>
    <span class="titlechip" id="titlechip"></span>
    <nav class="tabs" role="tablist">
      <button role="tab" data-view="read" aria-selected="true">Read</button>
      <button role="tab" data-view="words" aria-selected="false">Words</button>
      <button role="tab" data-view="profile" aria-selected="false">Profile</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// If the reader can't start, say so instead of leaving the page blank.
window.addEventListener("error", (ev) => {
  const main = document.getElementById("main");
  if (!main || main.childElementCount) return;
  main.innerHTML = '<section class="panel"><h2>The reader couldn\u2019t start</h2><p></p><p>Reload the page. If this keeps happening, send this message along.</p></section>';
  main.querySelector("p").textContent = String(ev.message || ev.error || "Unknown error");
});
</script>
