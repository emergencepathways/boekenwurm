# The weekly diary reminder: once a week, asks the diary-reminder function to notify readers whose diary prompt is
# waiting (supabase/functions/diary-reminder). Sunday afternoon in the Netherlands, so the week's prompt can still be
# written. The function sends a device at most one reminder in 6 days, so it needs no secret; only the project URL.
name: Weekly diary reminder

on:
  schedule:
    - cron: "17 15 * * 0" # Sundays 15:17 UTC: 16:17 in winter, 17:17 in summer, Amsterdam time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send the reminders
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::Add the VITE_SUPABASE_URL secret (see publish.yml) to send weekly diary reminders."
            exit 0
          fi
          curl -fsS --retry 2 -X POST "${SUPABASE_URL%/}/functions/v1/diary-reminder"
