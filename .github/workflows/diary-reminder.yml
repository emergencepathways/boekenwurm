# The weekly diary reminder: once a week, asks the diary-reminder function to notify readers whose diary prompt is
# waiting (supabase/functions/diary-reminder). Sunday afternoon in the Netherlands, so the week's prompt can still be
# written. Needs the CRON_SECRET and VITE_SUPABASE_URL secrets (see publish.yml); without them it does nothing.
name: Weekly diary reminder

on:
  schedule:
    - cron: "17 15 * * 0" # Sundays 15:17 UTC: 16:17 in winter, 17:17 in summer, Amsterdam time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send the reminders
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Add the CRON_SECRET secret to send weekly diary reminders."
            exit 0
          fi
          curl -fsS --retry 2 -X POST "${SUPABASE_URL%/}/functions/v1/diary-reminder" -H "x-cron-secret: $CRON_SECRET"
